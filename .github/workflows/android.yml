# builds an installable android apk (debug-signed, fine for sideloading) and attaches it to a release
name: android
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: web files
        run: |
          mkdir www
          cp -r index.html manifest.json sw.js foods.json icon-192.png icon-512.png src www/
      - name: capacitor project
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/browser
          npx cap init "Macro Tracker" com.varunaahil.macrotracker --web-dir www
          npx cap add android
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android
          npx cap sync android
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if 'android:scheme="com.varunaahil.macrotracker"' not in s:
              f = '<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="com.varunaahil.macrotracker"/></intent-filter>'
              s = s.replace("</activity>", f + "</activity>", 1)
          open(p, "w").write(s)
          PY
          grep -q 'permission.CAMERA' android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: build apk
        run: |
          mkdir -p ~/.android && cp android-debug.keystore ~/.android/debug.keystore
          cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk macro-tracker.apk
      - name: show signing fingerprint
        continue-on-error: true
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs macro-tracker.apk | grep -i "sha-1\|sha1" || true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: macro-tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: macro-tracker-apk
          path: macro-tracker.apk
