<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Macro Tracker</title>
<style>
:root{
  --paper:#f4efe4; --card:#fbf8f1; --ink:#1f1c16; --muted:#7a7263; --line:#e2dbca;
  --chili:#cf4a2b; --leaf:#4f7a3a; --wheat:#c89b2c; --sky:#3f6f8f;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#17150f;--card:#201d15;--ink:#f1ebdc;--muted:#a39a85;--line:#34301f;
    --chili:#ef7655;--leaf:#8bbd6f;--wheat:#e3b94d;--sky:#7fb0d1}
  meta{color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}
.native main{padding-top:calc(18px + max(env(safe-area-inset-top, 0px), 36px))}
h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;white-space:nowrap}
h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:22px 0 8px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
button,input,select{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--ink);color:var(--paper);font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
button.small{padding:6px 10px;font-size:14px;border-radius:9px}
button.danger{background:transparent;color:var(--chili);padding:6px 8px}
button:disabled{opacity:.5}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.big{font-family:var(--serif);font-size:44px;line-height:1}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.macros b{font-family:var(--serif);font-size:20px}
.meal img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:8px}
.chip{display:inline-block;padding:6px 10px;margin:4px 6px 0 0;border:1px dashed var(--line);border-radius:20px;font-size:14px;background:var(--card)}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}
.item .name{font-weight:600}
.warn{color:var(--chili);font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--paper);width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;max-width:520px;margin:0 auto}
.pick{padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:20px;font-size:14px;z-index:9}
.cam{display:block;text-align:center;background:var(--chili);color:#fff;padding:26px;border-radius:18px;
  font-family:var(--serif);font-size:22px;cursor:pointer}
.cam input{display:none}

progress{width:100%;height:8px;accent-color:var(--chili)}
.note{font-size:13px;color:var(--muted);margin:6px 0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 6px}
.seg button{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:10px 2px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cam.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink);margin-top:12px;font-size:19px;padding:20px}
.sec{margin-top:22px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sechead b{font-family:var(--serif);font-size:20px}
.sec .card{margin:10px 0 0}
.sectoggle{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer;padding:2px 0}
.sectoggle:disabled{cursor:default}.sectoggle:disabled .chev{opacity:.25}
.sectoggle>span:last-child{display:flex;flex-direction:column;min-width:0}
.sectoggle b{font-family:var(--serif);font-size:20px}.sectoggle .sub{font-size:14px}
.chev{display:grid;place-items:center;transition:transform .15s;color:var(--muted)}
.sec.shut .chev{transform:rotate(-90deg)}
.count{font-family:var(--sans,inherit);font-size:12px;font-weight:600;background:var(--line);border-radius:10px;padding:1px 7px;vertical-align:2px}
nav{position:fixed;z-index:4;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;
  bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:var(--muted);
  border-radius:20px;padding:7px 2px 6px;font-size:11.5px;font-weight:600;letter-spacing:.2px}
nav .ic{width:44px;height:30px;display:grid;place-items:center;border-radius:15px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--chili);background:color-mix(in srgb,var(--chili) 14%,transparent)}
nav .plus .ic{background:var(--chili);color:#fff}
nav .plus.on{color:var(--chili)}
.datebar{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.icb{background:var(--card);color:var(--ink);border:1px solid var(--line);width:42px;height:42px;padding:0;border-radius:14px;display:grid;place-items:center}
.icb svg,.datechip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.datechip{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 14px;border-radius:14px;
  background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.calt{font-family:var(--serif);font-size:19px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}
.cal.wk{color:var(--muted);font-size:12px;font-weight:600;margin-top:14px}
.day{position:relative;width:42px;height:42px;margin:0 auto;padding:0;background:none;color:var(--ink);border-radius:50%;font-weight:500}
.day.now{box-shadow:inset 0 0 0 1.5px var(--chili)}
.day.sel{background:var(--chili);color:#fff;box-shadow:none}
.day i{position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--leaf)}
.day.sel i{background:#fff}
.tap{cursor:pointer}
.greet{margin:0 0 2px}
.banner{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin:12px 0 0;padding:12px 14px;text-align:left;
  background:color-mix(in srgb,var(--leaf) 16%,var(--card));color:var(--ink);border:1px solid color-mix(in srgb,var(--leaf) 45%,var(--line));border-radius:16px}
.banner span{font-weight:400;font-size:14px;color:var(--muted)}
nav .ic{position:relative}
nav .dot{position:absolute;top:2px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--chili);border:2px solid var(--card)}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:14px;background:var(--line)}
.split i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:14px}
.legend u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;text-decoration:none}
.irows{margin-top:6px}
.irows>div{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.mehead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.avatar{position:relative;border:0;padding:0;cursor:pointer;overflow:visible}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avcam{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper,#fff);font:600 14px/20px system-ui;text-align:center;border:2px solid var(--paper,transparent)}
.daydetail{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--line)}
.barhit{cursor:pointer}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--chili);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:26px;font-weight:600;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.tile{display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile b{font-family:var(--serif);font-size:22px;line-height:1.15}
.tile .muted{font-size:13px}
.chart{width:100%;height:auto;display:block}
.macros2{display:grid;gap:10px;margin-top:12px}
.mrow{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px}
.mrow .bar{margin:0}
.wlist{margin-top:10px;display:grid;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.sug{margin:10px 0}
.linkbtn{background:none;color:var(--muted);text-decoration:underline;padding:8px;font-weight:500}
body.onboarding nav{display:none}
body.onboarding{padding-bottom:0}
.ob{min-height:calc(100vh - 36px);display:flex;flex-direction:column}
.obtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.obprog{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.obprog i{display:block;height:100%;background:var(--chili);border-radius:6px;transition:width .25s}
.obbody{flex:1}
.obfoot{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 22%);display:grid;gap:6px}
.bigbtn{width:100%;padding:16px;font-size:17px;background:var(--chili);color:#fff;border-radius:16px}
.q{font-family:var(--serif);font-size:28px;font-weight:600;margin:6px 0 8px;line-height:1.15}
.lead{font-size:18px;line-height:1.45}
.obhero{padding-top:12vh;text-align:left}
.logo-lg{width:84px;height:84px;border-radius:22px;margin-bottom:18px}
.opts{display:grid;gap:10px;margin-top:8px}
.opts.row3{grid-template-columns:repeat(3,1fr)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:14px 16px;border-radius:16px;font-weight:500}
.opt b{font-weight:600}
.opt .muted{font-size:13.5px;font-weight:400}
.opt.on{border-color:var(--chili);background:color-mix(in srgb,var(--chili) 12%,var(--card))}
.opts.row3 .opt{align-items:center;text-align:center;padding:14px 4px;font-size:14px}
.seg.two{grid-template-columns:1fr 1fr}
.tgt label{margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script type="module" src="src/app.js"></script>
</body>
</html>
